
{% extends "resumebuilder/base.html" %}
{% block title %}cvdraft.co.ke{% endblock %}

{% block content %}
<div class="auth-container"> 
  <form method="post">
    {% csrf_token %}
    
    <div class="form-group">
      <label class="form-label" for="id_email">Email Address</label>
      <input type="email" name="email" id="id_email" class="form-input"
             placeholder="davejr@email.com" autocomplete="email"
             value="{{ form.email.value|default:'' }}" autofocus required />
      
      {% if form.email.errors %}
      <div class="form-error">
        <i class="fa-solid fa-circle-xmark"></i> {{ form.email.errors.0 }}
      </div>
      {% endif %}
    </div>

    <button type="submit" class="submit-btn">Submit</button>
  </form>
</div>
{% endblock %}
